services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${DB_NAME:-mealdash}
      MYSQL_USER: ${DB_USER:-mealdash}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-food-password}
    volumes:
      - mealdash_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8000"
volumes:
  mealdash_mysql:
