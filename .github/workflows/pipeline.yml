name: MealDash CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mealdash-classroom
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build container image
        run: docker build --pull -t mealdash:ci .

  deploy:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.EKS_CLUSTER_NAME != '' && vars.ECR_REPOSITORY != '' &&
      vars.DB_HOST != '' && vars.DB_NAME != '' && vars.DB_USER != ''
    needs: build-check
    runs-on: ubuntu-latest
    environment: classroom
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sign in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push unique immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Configure namespace deployment access
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Apply database connection settings
        run: |
          set -euo pipefail
          kubectl create configmap mealdash-config -n mealdash --from-literal=DB_HOST="$DB_HOST" --from-literal=DB_PORT=3306 --from-literal=DB_NAME="$DB_NAME" --from-literal=DB_USER="$DB_USER" --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
      - name: Deploy and wait for rollout
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          image_name="${IMAGE_URI%:*}"
          image_tag="${IMAGE_URI##*:}"
          sed -i "s|REPLACE_WITH_ECR_REPOSITORY_URL|$image_name|; s|newTag: classroom|newTag: $image_tag|" k8s/overlays/classroom/kustomization.yaml
          kubectl apply -k k8s/overlays/classroom
          kubectl rollout status deployment/mealdash -n mealdash --timeout=5m
          kubectl get ingress mealdash -n mealdash
