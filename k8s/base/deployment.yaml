apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealdash
  namespace: mealdash
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mealdash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealdash
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: mealdash:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mealdash-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealdash-db
                  key: password
            - name: STAFF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealdash-app
                  key: staff-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mealdash-app
                  key: secret-key
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 8
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
